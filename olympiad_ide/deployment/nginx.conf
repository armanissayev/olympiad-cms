# Include in the nginx http {} block. Templates require real TLS certificate paths.
# Rate values are starting configuration examples, not measured capacity claims.
limit_req_zone $binary_remote_addr zone=ide_submit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ide_background:10m rate=100r/s;

server {
    listen 443 ssl;
    server_name contest.example.org;
    ssl_certificate /etc/cms/tls/fullchain.pem;
    ssl_certificate_key /etc/cms/tls/privkey.pem;
    client_max_body_size 9m;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    proxy_connect_timeout 2s;
    proxy_cookie_flags ~.*_login secure httponly samesite=strict;
    proxy_cookie_flags _xsrf secure samesite=strict;

    location ^~ /ide/api/submissions {
        limit_req zone=ide_submit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8891;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /ide/api/runtime/ {
        limit_req zone=ide_background burst=500 nodelay;
        proxy_pass http://127.0.0.1:8891;
        add_header Cache-Control "no-store" always;
    }
    # Native WSGI authenticates ticket issuance; only this ticket-gated DAP route uses ASGI.
    location ~ "^/ide/api/debug/sessions/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/dap$" {
        if ($args != "") { return 400; }
        proxy_pass http://127.0.0.1:8801/api/v1/debug/sessions/$1/dap;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_read_timeout 330s;
        proxy_buffering off;
    }
    location /ide/ {
        proxy_pass http://127.0.0.1:8891;
    }
    location = /ide { return 308 /ide/; }
    # Keep the ordinary participant interface as the operational fallback.
    location / { proxy_pass http://127.0.0.1:8888; }
    # No admin, CMS RPC, database, IDE runtime or sandbox helper route is exposed.
}
