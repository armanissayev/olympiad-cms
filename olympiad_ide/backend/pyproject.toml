[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olympiad-ide-api"
version = "0.1.0"
description = "Backend foundation for Olympiad IDE"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.44,<3",
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.38,<1",
  "PyJWT==2.10.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["app"]
